name: Build/release

on:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      tmate_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false

permissions:
  contents: write

jobs:
  release-windows:
    name: Windows x64 installer and portable EXE
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      is_tag: ${{ startsWith(github.ref, 'refs/tags/v') }}
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tmate_enabled }}
        with:
          detached: true

      # Windows fix. See https://github.com/actions/checkout/issues/226
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v6

      - run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'yarn'

      # Because of timeout issue https://github.com/yarnpkg/yarn/issues/4890
      - run: yarn install --immutable --network-timeout 1000000

      - name: Download Windows x64 ffmpeg
        run: yarn download-ffmpeg-win32-x64

      - name: Build Windows installer, update metadata, and portable EXE
        run: yarn pack-win

      # Fails unless the packaged editor renders and quits cleanly; the screenshot shows the app window.
      - name: Smoke test packaged app
        run: node script/e2e.ts 'dist\win-unpacked\ClipPress.exe' screenshot.jpeg

      - name: Upload Windows preview artifacts
        if: env.is_tag == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ClipPress-Windows-x64-exe
          path: |
            dist/ClipPress-Windows-x64.exe
            dist/ClipPress-Setup-*.exe
            dist/latest.yml
            dist/*.blockmap
          if-no-files-found: error

      # Also after a failed smoke test, to show what the app displayed.
      - name: Upload Windows screenshot artifact
        if: ${{ !cancelled() && env.is_tag == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-windows
          path: screenshot.jpeg
          if-no-files-found: warn

      - name: Publish tagged GitHub release and update feed
        if: env.is_tag == 'true'
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/ClipPress-Windows-x64.exe
            dist/ClipPress-Setup-*.exe
            dist/latest.yml
            dist/*.blockmap
