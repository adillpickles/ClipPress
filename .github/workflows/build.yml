name: Build/release

on:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      tmate_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false

permissions:
  contents: write

jobs:
  release-windows:
    name: Windows x64 portable EXE
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      is_tag: ${{ startsWith(github.ref, 'refs/tags/v') }}
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tmate_enabled }}
        with:
          detached: true

      # Windows fix. See https://github.com/actions/checkout/issues/226
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'yarn'

      # This global ffmpeg is used for screenshots (see below)
      - uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
          linking-type: static
          # As of version 3 of this action, builds are no longer downloaded from GitHub
          # except on Windows: https://github.com/GyanD/codexffmpeg/releases.
          github-token: ${{ github.server_url == 'https://github.com' && github.token || '' }}

      - run: ffmpeg -version

      # Because of timeout issue https://github.com/yarnpkg/yarn/issues/4890
      - run: yarn install --immutable --network-timeout 1000000

      - name: Download Windows x64 ffmpeg
        run: yarn download-ffmpeg-win32-x64

      - name: Build Windows x64 portable EXE
        run: yarn pack-win

      - name: Smoke test packaged app
        run: node script/e2e.ts 'dist\win-unpacked\LosslessCut.exe' desktop screenshot.jpeg

      - name: Upload Windows portable EXE artifact
        if: env.is_tag == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ClipPress-Windows-x64-exe
          path: dist/ClipPress-Windows-x64.exe
          if-no-files-found: error

      - name: Upload Windows screenshot artifact
        if: env.is_tag == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-windows
          path: screenshot.jpeg
          if-no-files-found: error

      - name: Publish tagged GitHub release asset
        if: env.is_tag == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ClipPress-Windows-x64.exe
