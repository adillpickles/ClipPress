<?xml version="1.0" encoding="UTF-8"?>
<!--
  ClipPress application mark.

  An original ClipPress design: a play glyph held between two press bars, for
  "clip" and "press". Drawn as flat geometry with generous weight so it still
  reads at 16x16 in the Windows taskbar and tray.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="clippressTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ccad4"/>
      <stop offset="1" stop-color="#2b8e97"/>
    </linearGradient>
  </defs>

  <rect x="36" y="36" width="440" height="440" rx="100" fill="url(#clippressTile)"/>

  <!--
    The gaps around the play glyph are deliberately generous. With the bars any
    closer the three shapes merge into one block once the icon is scaled down to
    32px or 16px.
  -->
  <g fill="#0b1417">
    <rect x="146" y="112" width="220" height="34" rx="17"/>
    <rect x="146" y="366" width="220" height="34" rx="17"/>
    <path d="M202 200 L324 256 L202 312 Z" stroke="#0b1417" stroke-width="12" stroke-linejoin="round"/>
  </g>
</svg>
