<?xml version="1.0" encoding="UTF-8"?>
<!--
  macOS variant of the ClipPress mark.

  Same glyph as icon.svg, inset inside the canvas because macOS app icons are
  expected to sit in a smaller content box than the full square, so that the
  system's own spacing around Dock icons stays consistent.
  See https://github.com/mifi/lossless-cut/issues/1820 for why this is a
  separate file rather than a scaled copy.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="clippressTileMac" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ccad4"/>
      <stop offset="1" stop-color="#2b8e97"/>
    </linearGradient>
  </defs>

  <rect x="64" y="64" width="384" height="384" rx="88" fill="url(#clippressTileMac)"/>

  <g fill="#0b1417">
    <rect x="160" y="130" width="192" height="30" rx="15"/>
    <rect x="160" y="352" width="192" height="30" rx="15"/>
    <path d="M209 207 L315 256 L209 305 Z" stroke="#0b1417" stroke-width="10" stroke-linejoin="round"/>
  </g>
</svg>
